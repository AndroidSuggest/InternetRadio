name: Nightly Build

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: echo $ENCODED_KEYSTORE | base64 -di > app/radio-nightly.jks
          
      - name: Get build info
        id: build_info
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          
      - name: Build nightly APK
        env:
          NIGHTLY_STORE_PASSWORD: ${{ secrets.NIGHTLY_STORE_PASSWORD }}
          NIGHTLY_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          IS_NIGHTLY_BUILD: "true"
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
          NIGHTLY_DATE: ${{ env.date }}
        run: ./gradlew assembleFossNightly
        
      - name: Rename APK
        run: mv app/build/outputs/apk/foss/nightly/*.apk app/build/outputs/apk/foss/nightly/internetradio-nightly-${{ env.date }}.apk
        
      - name: Replace Nightly Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view nightly-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly-build --repo "$GITHUB_REPOSITORY" -y --cleanup-tag
          fi
          
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          
          gh release create nightly-build app/build/outputs/apk/foss/nightly/internetradio-nightly-${{ env.date }}.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Nightly Build - ${{ env.date }}" \
            --notes "This is the latest nightly build. It includes the newest features but may be unstable.

          **Changes include everything up to commit:** [\`$SHORT_SHA\`]($COMMIT_URL)"
